import org.gradle.internal.os.OperatingSystem

apply plugin: "application"

dependencies {
    implementation project(":core")

    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"

    implementation "org.lwjgl:lwjgl:$lwjgl3Version"
    implementation "org.lwjgl:lwjgl-glfw:$lwjgl3Version"
    implementation "org.lwjgl:lwjgl-opengl:$lwjgl3Version"

    String natives = "natives-linux"
    if (OperatingSystem.current().isWindows()) {
        natives = "natives-windows"
    } else if (OperatingSystem.current().isMacOsX()) {
        String arch = System.getProperty("os.arch", "")
        natives = arch.contains("aarch64") || arch.contains("arm64")
                ? "natives-macos-arm64"
                : "natives-macos"
    }

    runtimeOnly "org.lwjgl:lwjgl:$lwjgl3Version:$natives"
    runtimeOnly "org.lwjgl:lwjgl-glfw:$lwjgl3Version:$natives"
    runtimeOnly "org.lwjgl:lwjgl-opengl:$lwjgl3Version:$natives"
}

application {
    mainClass = "com.battlecity.lwjgl3.Lwjgl3Launcher"
}

def isWsl() {
    if (System.getenv("WSL_DISTRO_NAME") != null || System.getenv("WSL_INTEROP") != null) {
        return true
    }
    def versionFile = file("/proc/version")
    if (!versionFile.exists()) {
        return false
    }
    def version = versionFile.text.toLowerCase()
    return version.contains("microsoft") || version.contains("wsl")
}

def configureLinuxDisplay(JavaExec exec) {
    if (!OperatingSystem.current().isLinux()) {
        return
    }
    if (System.getenv("DISPLAY") == null || System.getenv("DISPLAY").isBlank()) {
        exec.environment "DISPLAY", ":0"
    }
}

def configureWslGpuGraphics(JavaExec exec) {
    configureLinuxDisplay(exec)
    def wslLib = "/usr/lib/wsl/lib"
    if (file(wslLib).exists()) {
        def existing = System.getenv("LD_LIBRARY_PATH") ?: ""
        exec.environment "LD_LIBRARY_PATH", existing ? "$wslLib:$existing" : wslLib
    }
    // WSLg: force D3D12 instead of ZINK/llvmpipe (avoids libEGL / MESA startup failures).
    exec.environment "GALLIUM_DRIVER", "d3d12"
    // Skip DRI device probing; go straight to d3d12 (suppresses "failed to get driver name for fd -1").
    exec.environment "MESA_LOADER_DRIVER_OVERRIDE", "d3d12"
    // Suppress non-fatal EGL warnings from Mesa loader (device enumeration noise under WSLg).
    exec.environment "EGL_LOG_LEVEL", "fatal"
    // WSLg exposes Wayland but EGL/DRI is unreliable; X11 + D3D12 is the stable path.
    exec.environment "GLFW_PLATFORM", "x11"
    exec.doFirst {
        environment.remove("LIBGL_ALWAYS_SOFTWARE")
        // Prefer X11 over WSLg Wayland (EGL/DRI path is slow and often fails).
        environment.remove("WAYLAND_DISPLAY")
    }
}

def configureWslSoftwareGraphics(JavaExec exec) {
    configureLinuxDisplay(exec)
    exec.environment "LIBGL_ALWAYS_SOFTWARE", "1"
    exec.environment "GALLIUM_DRIVER", "llvmpipe"
    exec.environment "MESA_GL_VERSION_OVERRIDE", "3.3"
    exec.environment "GLFW_PLATFORM", "x11"
    exec.doFirst {
        environment.remove("WAYLAND_DISPLAY")
    }
}

// Standard run (native Linux GPU when available; WSLg D3D12 + no-vsync under WSL)
tasks.named("run", JavaExec).configure {
    jvmArgs = []
    if (OperatingSystem.current().isMacOsX()) {
        jvmArgs("-XstartOnFirstThread")
    }
    if (OperatingSystem.current().isLinux() && isWsl()) {
        configureWslGpuGraphics(it)
    } else {
        configureLinuxDisplay(it)
    }
}

// Try WSLg hardware-accelerated GPU (D3D12) — use if software rendering is too slow
tasks.register("runWslGpu", JavaExec) {
    group = "application"
    description = "Run client on WSL with hardware GPU (D3D12) — use if software rendering is too slow"
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set(application.mainClass.get())
    standardInput = System.in

    if (OperatingSystem.current().isMacOsX()) {
        jvmArgs("-XstartOnFirstThread")
    }

    if (project.hasProperty("gameArgs")) {
        args project.gameArgs.toString().split(" ")
    } else {
        args "127.0.0.1", "9000"
    }

    configureWslGpuGraphics(it)
}
